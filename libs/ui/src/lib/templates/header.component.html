<div flex-row gap2 flex-align-center>
  <div flex-column flex-fullwidth>
    @if(!!headline()) {
      <h2
        mr-m0
        class="mb-header-headline"
        [innerHTML]="headline()"
      ></h2>
    }

    @if (subline()) {
      <h4
        mr-m0
        class="mb-header-subline"
        [innerHTML]="subline()"
      ></h4>
    }
  </div>
  <div flex-column >
      <ng-content></ng-content>
  </div>
</div>
