<div class="grid">
  @if(isConnected()) {
    @if(dataLoaded()) {
      @for(stock of sortedStocks(); track $index) {
        <stock-card [stock]="stock" (toggle)="toggle(stock)" />
      }
    } @else  {
      LOADING.....
    }

  } @else {
    Not able to connect to server, please try again after sometime!
  }
</div>
